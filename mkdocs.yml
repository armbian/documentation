
site_name: Armbian Documentation
site_author: "Armbian team"
site_url: https://docs.armbian.com
site_description: Official documentation for Armbian OS and Armbian build framework
copyright: '&copy; 2026 Armbian. Open source Linux for ARM boards.'
repo_url: https://github.com/armbian/documentation
edit_uri: edit/main/docs/
repo_name: armbian/documentation

# docs/README.md is a folder placeholder for GitHub's directory view; it
# collides with index.md as the site home. Exclude it from the build so
# `mkdocs build --strict` does not abort on the conflict warning.
exclude_docs: |
  /README.md

# Software category hub pages (e.g. Monitoring.md) are kept for SEO and the
# existing /User-Guide_Armbian-Software/<Category>/ URLs, but are reached via
# search and the app pages' back-link rather than the nav, so building them
# outside the nav must not warn (matters under `mkdocs build --strict`).
not_in_nav: |
  /User-Guide_Armbian-Software/*.md
  /releases/*.md
  !/releases/index.md
  !/releases/release-model.md

theme:
    name: material
    custom_dir: overrides
    logo: images/armbian-logo.png
    icon:
      repo: fontawesome/brands/github-alt
    font:
        text: DM Sans
        code: JetBrains Mono
    palette:
        - scheme: default
          primary: custom
          accent: custom
          toggle:
            icon: material/toggle-switch-off-outline
            name: Switch to dark mode
        - scheme: slate
          primary: custom
          accent: custom
          toggle:
            icon: material/toggle-switch
            name: Switch to light mode
    favicon: images/logo.png
    features:
        - content.action.edit
        - content.action.view
        - content.code.copy
        - navigation.tabs
        - navigation.top

extra_css:
  - css/armbian-extra.css

extra:
  analytics:
    provider: google
    property: UA-284946-9
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/armbian
    - icon: fontawesome/solid/house
      link: https://www.armbian.com/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/armbian

plugins:
  - search
  - redirects:
      redirect_maps:
        # Device-tree overlays are managed through armbian-config now; the old
        # manual overlay pages redirect to the config docs.
        'User-Guide_Allwinner_overlays.md': 'config/index.md'
        'User-Guide_Armbian_overlays.md': 'config/index.md'
        'Release_Changelog.md': 'releases/index.md'
        # Multipass is no longer referenced anywhere in armbian/build; Docker is
        # the supported containerised host.
        'Developer-Guide_Building-with-Multipass.md': 'build-framework/getting-started.md'
        'Process_Release-Model.md': 'releases/release-model.md'
        # Armbian Software overview moved to /software/
        'User-Guide_Armbian-Software.md': 'software/index.md'
        # Emptied legacy software category hubs -> software overview
        'User-Guide_Armbian-Software/Desktops.md': 'software/index.md'
        'User-Guide_Armbian-Software/Music.md': 'software/index.md'
        # Getting Started moved to short /getting-started/ URLs
        'User-Guide_Getting-Started.md': 'getting-started/index.md'
        # armbian-config pages live at /config/; keep every earlier URL working
        'User-Guide_Armbian-Config.md': 'config/index.md'
        'User-Guide_Armbian-Config/System.md': 'config/index.md'
        'User-Guide_Armbian-Config/Network.md': 'config/network.md'
        'User-Guide_Armbian-Config/Localisation.md': 'config/localisation.md'
        # Recovery was folded into Troubleshooting in March 2025; the nav
        # section is still titled 'Troubleshooting and Recovery'.
        'User-Guide_Recovery.md': 'user-guide/troubleshooting.md'
        'User-Guide_Advanced-Configuration.md': 'user-guide/advanced-configuration.md'
        'User-Guide_Networking.md': 'user-guide/networking.md'
        'User-Guide_Autoconfig.md': 'user-guide/autoconfig.md'
        'User-Guide_Troubleshooting.md': 'user-guide/troubleshooting.md'
        'User-Guide_FAQ.md': 'user-guide/faq.md'
        # The build framework section moved to /build-framework/; keep every
        # Developer-Guide_* URL working.
        'Developer-Guide_Adding-Board-Family.md': 'build-framework/adding-a-board.md'
        'Developer-Guide_Build-Commands.md': 'build-framework/commands/index.md'
        'Developer-Guide_Build-Preparation.md': 'build-framework/getting-started.md'
        'Developer-Guide_Build-Switches.md': 'build-framework/switches/index.md'
        'Developer-Guide_Building-with-Docker.md': 'build-framework/getting-started.md'
        'Developer-Guide_Desktops.md': 'build-framework/desktops.md'
        'Developer-Guide_Extension-ccache-remote.md': 'build-framework/extensions/ccache-remote.md'
        'Developer-Guide_Extension-kernel-rust.md': 'build-framework/extensions/kernel-rust.md'
        'Developer-Guide_Extensions-Hooks.md': 'build-framework/extensions/hooks.md'
        'Developer-Guide_Extensions-List.md': 'build-framework/extensions/list.md'
        'Developer-Guide_Extensions.md': 'build-framework/extensions/index.md'
        'Developer-Guide_Overview.md': 'build-framework/index.md'
        'Developer-Guide_User-Configurations.md': 'build-framework/user-configurations.md'
        'Developer-Guide_Welcome.md': 'build-framework/getting-started.md'
        # The transition-era CLI page was folded into Commands/Switches
        'build-framework/cli.md': 'build-framework/commands/index.md'
        # Community / Contribute pages moved to SEO-friendly /community/ and /contribute/ URLs
        'Community_Forums.md': 'community/forums.md'
        'Community_IRC.md': 'community/chat.md'
        'Community_Github.md': 'community/github.md'
        'Process_Contribute.md': 'contribute/index.md'
        'Contribute/Armbian-config.md': 'contribute/armbian-config.md'
        'WifiPerformance.md': 'status/wifi-performance.md'
        'Mirrors.md': 'status/mirrors.md'
        'contribute/wifi-performance.md': 'status/wifi-performance.md'
        'contribute/mirrors.md': 'status/mirrors.md'
        'Contribute/Datacenter.md': 'contribute/datacenter.md'
        'User-Guide_Board-Support-Rules.md': 'contribute/board-support-rules.md'
        'Release_Board-Maintainers.md': 'contribute/board-maintainer.md'
        'Board_Maintainers_Procedures_and_Guidelines.md': 'contribute/board-maintainer.md'
        'Process_Managing_Workflow.md': 'contribute/index.md'
        'Process_Armbian-Task-Tracking.md': 'contribute/index.md'
        'Process_CI.md': 'contribute/automation.md'

markdown_extensions:
  - smarty
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - footnotes
  - mdx_truly_sane_lists
  - toc:
      permalink: True
  - pymdownx.highlight:
      auto_title: true
      linenums: true
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
      - name: custombash
        class: custom-bash-block
        format: !!python/name:pymdownx.superfences.fence_code_format
  - markdown.extensions.admonition # Highlighted warning/info blocks
  - markdown.extensions.meta # Define meta data (page title and description) at the top of the Markdown document
  - markdown.extensions.tables # Tables
  - pymdownx.betterem: # More intuitive emphasis handling
      smart_enable: all # Even smarter for both (asterisk and underscore) syntax => GitHub-like
  - pymdownx.details # Collapsible details blocks
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys # Keyboard key symbols
  - pymdownx.magiclink: # Auto-links non angle bracket URLs and email addresses and allows to shorten and visualise Git repo links
      repo_url_shortener: true
      repo_url_shorthand: true
  - pymdownx.superfences # Indented code blocks, e.g. within lists, admonition, details or tabbed blocks, implies pymdownx.highlight
  - pymdownx.tabbed: # Tabbed content blocks
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      combine_header_slug: true

