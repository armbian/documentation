name: "Pull from Armbian config"

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  Build:
    name: "Pull"
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'armbian' }}
    steps:

      - name: Checkout main documentation
        uses: actions/checkout@v7
        with:
          repository: 'armbian/documentation'
          path: 'documentation'

      - name: Checkout Armbian config repository
        uses: actions/checkout@v7
        with:
          repository: 'armbian/configng'
          path: 'config'

      - name: Make docs
        run: |

          cd config
          tools/config-assemble.sh -p
          tools/config-markdown.py -u

          # rsync images first
          rsync -avr tools/include/images/. ../documentation/docs/images/

          # armbian-config pages live at short lowercase /armbian-config/<page>/ URLs.
          # System is split into per-subcategory pages (Kernel/Desktops/Storage/
          # Access/User/Updates); sync those (lowercased) and skip System.md.
          # armbian-config/index.md (the overview) is hand-maintained, not synced.
          mkdir -p ../documentation/docs/config/
          rsync -avr docs/Localisation/Localisation.md ../documentation/docs/config/localisation.md
          rsync -avr docs/Network/Network.md ../documentation/docs/config/network.md
          for f in Kernel Desktops Storage Access User Updates; do
            rsync -avr "docs/System/$f.md" "../documentation/docs/config/$(echo "$f" | tr 'A-Z' 'a-z').md"
          done

          # the rest goes under armbian-software (category hubs + section pages)
          mkdir -p ../documentation/docs/User-Guide_Armbian-Software/
          rsync -avr --exclude="Software.user.md" docs/Software/* ../documentation/docs/User-Guide_Armbian-Software/

          # per-app SEO pages get their own top-level /software/<slug>/ URLs
          mkdir -p ../documentation/docs/software/
          rsync -avr --delete --exclude=index.md docs/software/. ../documentation/docs/software/

      - name: Regenerate the software navigation
        # Rebuild the "ARMBIAN SOFTWARE" nav (category -> app pages) from the
        # freshly synced app pages, so new/removed apps appear in the left nav.
        run: python3 documentation/tools/build-software-nav.py

      - name: Create Pull Request to documentation
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: documentation
          commit-message: '`Automatic` documentation update'
          signoff: false
          branch: auto-update-docs
          delete-branch: true
          title: '`Automatic` documentation update'
          body: |
            Generate documentation.

          labels: |
            Needs review
          #assignees: igorpecovnik
          #reviewers: Must be org collaborator
          draft: false
