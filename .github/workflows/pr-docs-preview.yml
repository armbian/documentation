name: Create docs preview on PR

# Build only, with a read-only token, so fork PRs work too.
# pr-docs-preview-publish.yml publishes the result and comments on the PR.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read

jobs:
  docs-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch (documentation)
        if: github.event.pull_request.state == 'open'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: documentation

      - name: Set up Python
        if: github.event.pull_request.state == 'open'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        if: github.event.pull_request.state == 'open'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('documentation/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        if: github.event.pull_request.state == 'open'
        working-directory: documentation
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -r requirements.txt

      - name: Build docs with MkDocs
        if: github.event.pull_request.state == 'open'
        working-directory: documentation
        run: mkdocs build --clean --site-dir ../preview/site

      # On a closed PR, only the metadata goes up, so the publish workflow removes the preview.
      - name: Write preview metadata
        env:
          PR: ${{ github.event.number }}
          ACTION: ${{ github.event.pull_request.state == 'open' && 'publish' || 'remove' }}
        run: |
          mkdir -p preview
          echo "${PR}" > preview/pr
          echo "${ACTION}" > preview/action

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview
          path: preview/
          retention-days: 1
