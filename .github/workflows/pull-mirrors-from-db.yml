name: "Pull mirrors from database"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  Build:
    name: "Pull"
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'armbian' }}
    steps:

      - name: Checkout main documentation
        uses: actions/checkout@v7
        with:
          repository: 'armbian/documentation'
          path: 'documentation'

      - name: Update rsync section
        run: |
          FILE="documentation/docs/Mirrors.md"
          sed '/^### 2\. Set up synchronization via rsync/,$d' "$FILE" > tmp.md
          cat <<EOF >> tmp.md
          ### 2. Set up synchronization via rsync

            - Sync files from one of the official repositories using the following commands:

            | Content         | Command                                     | Required Space |
            |-----------------|---------------------------------------------|---------------:|
          EOF
          for storage in dl apt archive oldarchive; do
            size=$(curl -s https://fi.mirror.armbian.de/$storage/size.txt)
            case "$storage" in
              "dl")
                TEXT="Current images"
                ;;
              "apt")
                TEXT="Packages"
                ;;
              "archive")
                TEXT="Archived images"
                ;;
              *)
                TEXT="Very old images"
                ;;
            esac
            echo "   | $TEXT | \`rsync -av rsync://fi.mirror.armbian.de/$storage\` | $size |" >> tmp.md
          done
          sed -n '/^## Current Mirrors/,$p' "$FILE" >> tmp.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' tmp.md
          mv tmp.md "$FILE"
  
      - name: Update Current Mirrors section
        run: |
          FILE="documentation/docs/Mirrors.md"
          sed '/^## Current Mirrors/,$d' "$FILE" > tmp.md
          cat <<EOF >> tmp.md
          ## Current Mirrors

          | Site | Time Zone | Flag | Speed  | Packages | Images | Archive | Rsync |
          |:-----|:----------|------|-------:|:--------:|:------:|:-------:|:-----:|
          EOF
          JQ=$(curl -s -H "Authorization: Token ${{ secrets.NETBOX_TOKEN }}" \
                    -H "Accept: application/json; indent=4" \
                    "${{ secrets.NETBOX_API }}/virtualization/virtual-machines/?limit=500&name__empty=false&role=mirror&status=active")
          for i in $(echo $JQ | jq '.results[] | .id'); do
            NAME=$(echo $JQ | jq ".results[] | select(.id == $i) | .name" | sed "s/\"//g")
            SITE_ID=$(echo $JQ | jq ".results[] | select(.id == $i) | .site.id")
            SITE_STATUS=$(echo $JQ | jq -r ".results[] | select(.id == $i) | .status.value")
            SITE_TAGS=$(echo $JQ | jq -r ".results[] | select(.id == $i) | .tags[].slug" | xargs )
            SITEQ=$(curl -s -H "Authorization: Token ${{ secrets.NETBOX_TOKEN }}" \
                          -H "Accept: application/json; indent=4" \
                          "${{ secrets.NETBOX_API }}/dcim/sites/?limit=500&name__empty=false&id=$SITE_ID")
            SITE_NAME=$(echo $SITEQ | jq -r ".results[] | select(.id == $SITE_ID) | .name" | sed 's/ /\&nbsp;/g')
            SITE_REGION=$(echo $SITEQ | jq -r ".results[] | select(.id == $SITE_ID) | .region.display")
            SITE_TZ=$(echo $SITEQ | jq -r ".results[] | select(.id == $SITE_ID) | .time_zone")
            SITE_LATITUDE=$(echo $SITEQ | jq ".results[] | select(.id == $SITE_ID) | .latitude")
            SITE_LONGITUDE=$(echo $SITEQ | jq ".results[] | select(.id == $SITE_ID) | .longitude")
            SITE_SPEED=$(echo $SITEQ | jq -r ".results[] | select(.id == $SITE_ID) | .custom_fields.download_speed")
            IP=$(dig +short "${NAME}" | tail -1)
            # Resolve the mirror's country for the flag. ipwhois.app was dropped:
            # its free tier now rate-limits after ~2 requests and returns
            # {"success":false,"country_code":null}, so in this ~40-mirror loop
            # nearly every flag became flagsapi.com/null. ip-api.com is free
            # (45 req/min, no key) and returns countryCode. Retry a few times on
            # a transient/rate-limited response and validate a 2-letter code;
            # leave it empty (no broken flag) rather than emitting "null".
            # Guard the empty-IP case: ip-api.com/json/ with no address geolocates
            # the *runner's* IP, which would stamp a wrong flag on a mirror whose
            # DNS didn't resolve. Only look up a real address.
            SITE_FLAG=""
            if [[ -n "$IP" ]]; then
              for attempt in 1 2 3; do
                GEO=$(curl --max-time 8 -s "http://ip-api.com/json/${IP}?fields=status,countryCode")
                if [[ "$(echo "$GEO" | jq -r '.status')" == "success" ]]; then
                  CC=$(echo "$GEO" | jq -r '.countryCode')
                  if [[ "$CC" =~ ^[A-Za-z]{2}$ ]]; then SITE_FLAG="$CC"; break; fi
                fi
                sleep 3
              done
            fi
            [[ $SITE_STATUS == "decommissioning" ]] && continue
            if [[ $SITE_STATUS != "active" ]]; then
              LABEL=":x:"
            else
              LABEL=":white_check_mark:"
            fi
            if [[ "${SITE_TAGS}" == *"debs"* ]]; then FIELD1="$LABEL"; else FIELD1=""; fi
            if [[ "${SITE_TAGS}" == *"images"* ]]; then FIELD2="$LABEL"; else FIELD2=""; fi
            if [[ "${SITE_TAGS}" == *"archive"* ]]; then FIELD3="$LABEL"; else FIELD3=""; fi
            if [[ "${SITE_TAGS}" == *"rsync"* ]]; then FIELD4="$LABEL"; else FIELD4=""; fi
            # With a country code, link the flag; without one, fall back to a
            # plain region link so the cell never renders a broken flagsapi/null image.
            if [[ -n "$SITE_FLAG" ]]; then
              FLAG_CELL="[![$SITE_REGION](https://flagsapi.com/$SITE_FLAG/shiny/32.png)](https://www.openstreetmap.org/search?lat=$SITE_LATITUDE&lon=$SITE_LONGITUDE)"
            else
              FLAG_CELL="[$SITE_REGION](https://www.openstreetmap.org/search?lat=$SITE_LATITUDE&lon=$SITE_LONGITUDE)"
            fi
            echo "| [$SITE_NAME](https://$NAME) | $SITE_TZ | $FLAG_CELL | $SITE_SPEED&nbsp;Mbps | $FIELD1 | $FIELD2 | $FIELD3 | $FIELD4 |" >> tmp.md
            sleep 1
          done
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' tmp.md
          mv tmp.md "$FILE"

          # Surface the rendered mirror table in the workflow run summary.
          sed -n '/^## Current Mirrors/,$p' "$FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request to documentation
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: documentation
          commit-message: '`Automatic` documentation update'
          signoff: false
          branch: auto-update-docs
          delete-branch: true
          title: '`Automatic` documentation update'
          body: |
            Generate documentation.

          labels: |
            Needs review
          #assignees: igorpecovnik
          #reviewers: Must be org collaborator
          draft: false
