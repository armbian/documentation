name: "Pull mirrors from database"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:

  Build:
    name: "Pull"
    runs-on: ubuntu-24.04
    if: ${{ github.repository_owner == 'armbian' }}
    steps:

      - name: Checkout main documentation
        uses: actions/checkout@v7
        with:
          repository: 'armbian/documentation'
          path: 'documentation'

      - name: Update rsync section
        run: |
          FILE="documentation/docs/contribute/mirrors.md"
          sed '/^### 2\. Set up synchronization via rsync/,$d' "$FILE" > tmp.md
          cat <<EOF >> tmp.md
          ### 2. Set up synchronization via rsync

            - Sync files from one of the official repositories using the following commands:

            | Content         | Command                                     | Required Space |
            |-----------------|---------------------------------------------|---------------:|
          EOF
          for storage in dl apt archive oldarchive; do
            size=$(curl -s https://fi.mirror.armbian.de/$storage/size.txt)
            case "$storage" in
              "dl")
                TEXT="Current images"
                ;;
              "apt")
                TEXT="Packages"
                ;;
              "archive")
                TEXT="Archived images"
                ;;
              *)
                TEXT="Very old images"
                ;;
            esac
            echo "   | $TEXT | \`rsync -av rsync://fi.mirror.armbian.de/$storage\` | $size |" >> tmp.md
          done
          sed -n '/^## Current Mirrors/,$p' "$FILE" >> tmp.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' tmp.md
          mv tmp.md "$FILE"
  
      - name: Update Current Mirrors section
        run: |
          FILE="documentation/docs/contribute/mirrors.md"
          sed '/^## Current Mirrors/,$d' "$FILE" > tmp.md
          cat <<EOF >> tmp.md
          ## Current Mirrors

          | Site | Flag | Packages | Images | Archive | Rsync |
          |:-----|------|:--------:|:------:|:-------:|:-----:|
          EOF
          JQ=$(curl -s -H "Authorization: Token ${{ secrets.NETBOX_TOKEN }}" \
                    -H "Accept: application/json; indent=4" \
                    "${{ secrets.NETBOX_API }}/virtualization/virtual-machines/?limit=500&name__empty=false&role=mirror&status=active")
          # Country flag comes from the site's NetBox region slug, not a live
          # GeoIP lookup: it's human-maintained, deterministic, has no rate
          # limits, and doesn't mis-flag CDN-fronted mirrors (GeoIP put Hetzner
          # in FI and Macarne in US). NetBox regions are continent > country;
          # US mirrors sit under North America as coast regions, so those map to
          # US. A region with no country here (e.g. "Dynamic") renders flagless.
          # Add a line when a mirror lands in a new country/region.
          declare -A CC_BY_REGION=(
            [china]=CN [india]=IN [japan]=JP [korea]=KR [singapore]=SG [taiwan]=TW
            [austria]=AT [bulgaria]=BG [denmark]=DK [estonia]=EE [finland]=FI
            [france]=FR [germany]=DE [italy]=IT [netherlands]=NL [poland]=PL
            [russia]=RU [slovenia]=SI [spain]=ES [sweden]=SE [ukraine]=UA
            [united-kingdom]=GB
            [australia]=AU
            [north-america]=US [east-coast]=US [west-coast]=US [virginia]=US
          )
          # Country name per ISO code, used as the flag image's alt text so it
          # reads as the country (not the region label, which can be a coast).
          declare -A COUNTRY_BY_CC=(
            [CN]="China" [IN]="India" [JP]="Japan" [KR]="Korea" [SG]="Singapore" [TW]="Taiwan"
            [AT]="Austria" [BG]="Bulgaria" [DK]="Denmark" [EE]="Estonia" [FI]="Finland"
            [FR]="France" [DE]="Germany" [IT]="Italy" [NL]="Netherlands" [PL]="Poland"
            [RU]="Russia" [SI]="Slovenia" [ES]="Spain" [SE]="Sweden" [UA]="Ukraine"
            [GB]="United Kingdom"
            [AU]="Australia" [US]="United States"
          )
          for i in $(echo $JQ | jq '.results[] | .id'); do
            NAME=$(echo $JQ | jq ".results[] | select(.id == $i) | .name" | sed "s/\"//g")
            SITE_ID=$(echo $JQ | jq ".results[] | select(.id == $i) | .site.id")
            SITE_STATUS=$(echo $JQ | jq -r ".results[] | select(.id == $i) | .status.value")
            SITE_TAGS=$(echo $JQ | jq -r ".results[] | select(.id == $i) | .tags[].slug" | xargs )
            SITEQ=$(curl -s -H "Authorization: Token ${{ secrets.NETBOX_TOKEN }}" \
                          -H "Accept: application/json; indent=4" \
                          "${{ secrets.NETBOX_API }}/dcim/sites/?limit=500&name__empty=false&id=$SITE_ID")
            SITE_NAME=$(echo $SITEQ | jq -r ".results[] | select(.id == $SITE_ID) | .name" | sed 's/ /\&nbsp;/g')
            SITE_REGION=$(echo $SITEQ | jq -r ".results[] | select(.id == $SITE_ID) | .region.display")
            SITE_REGION_SLUG=$(echo $SITEQ | jq -r ".results[] | select(.id == $SITE_ID) | .region.slug // empty")
            SITE_LATITUDE=$(echo $SITEQ | jq ".results[] | select(.id == $SITE_ID) | .latitude")
            SITE_LONGITUDE=$(echo $SITEQ | jq ".results[] | select(.id == $SITE_ID) | .longitude")
            # Drop decommissioning mirrors before we render a row for them.
            [[ $SITE_STATUS == "decommissioning" ]] && continue
            # Country code for the flag, from the region slug (empty if the
            # region has no country mapping, e.g. "Dynamic").
            SITE_FLAG="${CC_BY_REGION[$SITE_REGION_SLUG]:-}"
            if [[ $SITE_STATUS != "active" ]]; then
              LABEL=":x:"
            else
              LABEL=":white_check_mark:"
            fi
            if [[ "${SITE_TAGS}" == *"debs"* ]]; then FIELD1="$LABEL"; else FIELD1=""; fi
            if [[ "${SITE_TAGS}" == *"images"* ]]; then FIELD2="$LABEL"; else FIELD2=""; fi
            if [[ "${SITE_TAGS}" == *"archive"* ]]; then FIELD3="$LABEL"; else FIELD3=""; fi
            if [[ "${SITE_TAGS}" == *"rsync"* ]]; then FIELD4="$LABEL"; else FIELD4=""; fi
            # Flag cell: a country flag (alt = country name) linked to the site
            # location; the "Dynamic" region is a Cloudflare-anycast mirror with
            # no single country, so it gets the UN "global" flag as an icon
            # (flagsapi has no UN flag; flagcdn does) with a Cloudflare alt.
            if [[ -n "$SITE_FLAG" ]]; then
              COUNTRY_NAME="${COUNTRY_BY_CC[$SITE_FLAG]:-$SITE_REGION}"
              FLAG_CELL="[![$COUNTRY_NAME](https://flagsapi.com/$SITE_FLAG/shiny/32.png)](https://www.openstreetmap.org/search?lat=$SITE_LATITUDE&lon=$SITE_LONGITUDE)"
            elif [[ "$SITE_REGION_SLUG" == "dynamic" ]]; then
              FLAG_CELL="![Cloudflare anycast](https://flagcdn.com/32x24/un.png)"
            else
              FLAG_CELL="[$SITE_REGION](https://www.openstreetmap.org/search?lat=$SITE_LATITUDE&lon=$SITE_LONGITUDE)"
            fi
            echo "| [$SITE_NAME](https://$NAME) | $FLAG_CELL | $FIELD1 | $FIELD2 | $FIELD3 | $FIELD4 |" >> tmp.md
          done
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' tmp.md
          mv tmp.md "$FILE"

          # Surface the rendered mirror table in the workflow run summary.
          sed -n '/^## Current Mirrors/,$p' "$FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request to documentation
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: documentation
          commit-message: '`Automatic` mirror list update'
          signoff: false
          branch: auto-update-mirrors
          delete-branch: true
          title: '`Automatic` mirror list update'
          body: |
            Regenerated the **Current Mirrors** table in
            `docs/contribute/mirrors.md` from the mirror inventory in NetBox.
          labels: |
            Needs review
          draft: false
